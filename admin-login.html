
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSKILLS Admin Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(rgba(11,31,91,.9),
rgba(11,31,91,.9)),
url('https://images.unsplash.com/photo-1497366754035-f200968a6e72');
background-size:cover;
background-position:center;
padding:20px;
}

.login-container{
width:100%;
max-width:460px;
}

.login-card{
background:white;
padding:40px;
border-radius:24px;
box-shadow:0 25px 60px rgba(0,0,0,.25);
}

.logo{
text-align:center;
margin-bottom:25px;
}

.logo img{
width:140px;
}

.admin-badge{
display:inline-block;
background:#dc2626;
color:white;
padding:8px 18px;
border-radius:30px;
font-size:13px;
font-weight:600;
margin-bottom:15px;
}

h1{
text-align:center;
color:#0B1F5B;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#64748b;
margin-bottom:25px;
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;
font-weight:500;
color:#334155;
}

input{
width:100%;
padding:14px;
border:1px solid #dbe2ea;
border-radius:12px;
font-size:15px;
}

input:focus{
outline:none;
border-color:#dc2626;
}

.login-btn{
width:100%;
padding:15px;
border:none;
background:#0B1F5B;
color:white;
border-radius:12px;
font-size:16px;
font-weight:600;
cursor:pointer;
}

.login-btn:hover{
background:#163EA8;
}

.demo{
margin-top:20px;
padding:15px;
background:#f8fafc;
border-left:4px solid #dc2626;
border-radius:10px;
font-size:14px;
}

.back-link{
text-align:center;
margin-top:20px;
}

.back-link a{
text-decoration:none;
color:#0B1F5B;
font-weight:600;
}

.footer{
text-align:center;
margin-top:20px;
font-size:13px;
color:#94a3b8;
}

</style>
</head>
<body>

<div class="login-container">

<div class="login-card">

<div class="logo">

<img src="assets/logo.png" alt="JSKILLS">

<div style="text-align:center;margin-top:15px;">
<span class="admin-badge">
Administrator Portal
</span>
</div>

</div>

<h1>Admin Login</h1>

<p class="subtitle">
Manage schools, teachers, subscriptions and platform analytics.
</p>

<form action="admin-dashboard.html">

<div class="form-group">
<label>Admin ID</label>
<input
type="text"
placeholder="Enter Admin ID"
required>
</div>

<div class="form-group">
<label>Password</label>
<input
type="password"
placeholder="Enter Password"
required>
</div>

<button type="submit" class="login-btn">
Login to Admin Dashboard
</button>

</form>

<div class="demo">

<strong>Demo Credentials</strong>

<br><br>

Admin ID: ADMIN001

<br>

Password: admin123

</div>

<div class="back-link">

<a href="index.html">
← Back to Home
</a>

</div>

<div class="footer">
© 2026 JSKILLS Academy
</div>

</div>

</div>

</body>
</html>
