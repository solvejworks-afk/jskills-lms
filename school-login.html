
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSKILLS Academy - School Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(rgba(11,31,91,0.85),
    rgba(11,31,91,0.85)),
    url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f');
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-container{
    width:100%;
    max-width:420px;
}

.login-card{
    background:#fff;
    padding:40px;
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,0.2);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img{
    width:130px;
}

.logo h2{
    color:#0B1F5B;
    margin-top:10px;
}

.logo p{
    color:#666;
    font-size:13px;
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#0B1F5B;
    font-size:28px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:500;
    color:#333;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#F59E0B;
}

.login-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#F59E0B;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    background:#d97706;
}

.demo-box{
    margin-top:20px;
    background:#f8fafc;
    border-radius:10px;
    padding:15px;
    font-size:14px;
}

.demo-box strong{
    color:#0B1F5B;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#777;
    font-size:13px;
}

</style>
</head>
<body>

<div class="login-container">

<div class="login-card">

<div class="logo">

<!-- Replace with your logo -->
<img src="assets/logo.png" alt="JSKILLS Logo">

<h2>JSKILLS Academy</h2>
<p>Empower • Educate • Innovate</p>

</div>

<h1>School Login</h1>

<form action="role-select.html">

<div class="form-group">
<label>School ID</label>
<input
type="text"
placeholder="Enter School ID"
required>
</div>

<div class="form-group">
<label>Password</label>
<input
type="password"
placeholder="Enter Password"
required>
</div>

<button class="login-btn">
Login
</button>

</form>

<div class="demo-box">

<strong>Demo Credentials</strong>

<br><br>

School ID: SIS001

<br>

Password: demo123

</div>

<div class="footer">
© 2026 JSKILLS Academy. All Rights Reserved.
</div>

</div>

</div>

</body>
</html>
