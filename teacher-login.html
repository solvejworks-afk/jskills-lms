<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSKILLS Academy - Teacher Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(rgba(11,31,91,.88),
    rgba(11,31,91,.88)),
    url('https://images.unsplash.com/photo-1523240795612-9a054b0db644');
    background-size:cover;
    background-position:center;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-container{
    width:100%;
    max-width:450px;
}

.login-card{
    background:white;
    padding:40px;
    border-radius:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo img{
    width:140px;
    max-width:100%;
}

.portal-badge{
    display:inline-block;
    background:#F59E0B;
    color:white;
    padding:8px 16px;
    border-radius:30px;
    font-size:13px;
    font-weight:600;
    margin-bottom:15px;
}

h1{
    text-align:center;
    color:#0B1F5B;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#64748b;
    margin-bottom:25px;
    font-size:14px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#334155;
    font-weight:500;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #dbe2ea;
    border-radius:12px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#F59E0B;
}

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    font-size:14px;
}

.options a{
    text-decoration:none;
    color:#0B1F5B;
    font-weight:600;
}

.login-btn{
    width:100%;
    border:none;
    background:#0B1F5B;
    color:white;
    padding:15px;
    border-radius:12px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.login-btn:hover{
    background:#102a7d;
}

.demo-box{
    margin-top:20px;
    background:#f8fafc;
    border-radius:12px;
    padding:15px;
    font-size:14px;
    border-left:4px solid #F59E0B;
}

.demo-box strong{
    color:#0B1F5B;
}

.bottom-links{
    text-align:center;
    margin-top:20px;
}

.bottom-links a{
    color:#0B1F5B;
    text-decoration:none;
    font-weight:600;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#94a3b8;
    font-size:13px;
}

</style>
</head>
<body>

<div class="login-container">

<div class="login-card">

<div class="logo">
<img src="assets/logo.png" alt="JSKILLS Logo">
</div>

<div style="text-align:center;">
<span class="portal-badge">Teacher Portal</span>
</div>

<h1>Welcome Back</h1>

<p class="subtitle">
Sign in to manage classes, students, courses and reports.
</p>

<form action="teacher-dashboard.html">

<div class="form-group">
<label>Teacher ID</label>
<input
type="text"
placeholder="Enter Teacher ID"
required>
</div>

<div class="form-group">
<label>Password</label>
<input
type="password"
placeholder="Enter Password"
required>
</div>

<div class="options">

<label>
<input type="checkbox">
 Remember Me
</label>

<a href="#">
Forgot Password?
</a>

</div>

<button type="submit" class="login-btn">
Login to Dashboard
</button>

</form>

<div class="demo-box">

<strong>Demo Credentials</strong>

<br><br>

Teacher ID: TCH001

<br>

Password: password123

</div>

<div class="bottom-links">

<a href="role-select.html">
← Back to Role Selection
</a>

</div>

<div class="footer">

© 2026 JSKILLS Academy

</div>

</div>

</div>

</body>
</html>
